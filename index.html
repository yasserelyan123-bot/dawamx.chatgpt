<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DawamX HR</title>
<style>
:root{--brand:#f2a93b;--ink:#17202a;--muted:#6b7280;--bg:#f5f7fa;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Tahoma,Arial,sans-serif}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 18px 50px #0001}.brand{text-align:center;font-size:32px;font-weight:900}.brand span,.side-brand span{color:var(--brand)}.subtitle{text-align:center;color:var(--muted);margin:6px 0 25px}.lang{display:flex;justify-content:center;gap:8px;margin-bottom:18px}.lang button,.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 13px;cursor:pointer}.lang .active,.btn-primary{background:var(--brand);color:#171717}.field{display:grid;gap:7px;margin:14px 0}.field input,.search{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;font:inherit}.btn-primary{border:0;font-weight:800}.auth .btn-primary{width:100%}.demo{margin-top:18px;padding:12px;background:#fafafa;border-radius:10px;color:var(--muted);font-size:13px}.error{color:#c93636;margin-top:9px}.hidden{display:none}
.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:#17202a;color:#fff;padding:22px;position:sticky;top:0;height:100vh}.main{padding:24px;min-width:0}.side-brand{font-size:25px;font-weight:900;margin-bottom:25px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#ddd;text-align:start;padding:12px;border-radius:10px;cursor:pointer}.nav button:hover{background:#ffffff14}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.top-actions{display:flex;gap:8px;align-items:center}.user-pill{padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:999px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.stat{font-size:28px;font-weight:900;margin-top:8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.search{flex:1;min-width:240px}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:start}.table th{background:#fafafa}.notice{background:#fff7e8;border:1px solid #f2a93b55;border-radius:14px;padding:15px}.modal-backdrop{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:18px;z-index:50}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:22px}.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.profile-item{background:#fafafa;padding:12px;border-radius:10px}.profile-item b{display:block;margin-bottom:5px}
@media(max-width:850px){.shell{display:block}.sidebar{position:fixed;z-index:20;inset:0 auto 0 0;width:280px;transform:translateX(-105%);transition:.2s}.sidebar.open{transform:translateX(0)}[dir=rtl] .sidebar{inset:0 0 0 auto;transform:translateX(105%)}[dir=rtl] .sidebar.open{transform:translateX(0)}.main{padding:16px}.grid{grid-template-columns:repeat(2,1fr)}.mobile-menu{display:block!important}.overlay.open{display:block;position:fixed;inset:0;background:#0007;z-index:19}.mobile-menu{position:relative;z-index:21}}@media(max-width:520px){.grid{grid-template-columns:1fr}.profile-grid{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-wrap:wrap}}.mobile-menu{display:none}.overlay{display:none}
</style>
</head><body><div id="app"></div>
<script>
window.DX={};DX.lang=localStorage.getItem("dx_lang")||"ar";DX.session=null;DX.users=[{id:"ADM-0001",role:"admin",name:"DawamX Administrator",email:"admin@dawamx.com",password:"admin123"},{id:"0010",role:"employee",name:"محمد أحمد",email:"emp@dawamx.com",password:"0010"},{id:"0011",role:"employee",name:"Ahmed Ali",email:"emp2@dawamx.com",password:"0011"}];DX.t={ar:{sub:"نظام إدارة الموارد البشرية",id:"رقم الموظف / البريد",pass:"كلمة المرور",enter:"دخول",bad:"بيانات الدخول غير صحيحة"},en:{sub:"Human Resources Management",id:"Employee ID / Email",pass:"Password",enter:"Sign in",bad:"Invalid credentials"}};DX.setLang=l=>{DX.lang=l;localStorage.setItem("dx_lang",l);DX.renderLogin()};DX.login=(id,p)=>{let u=DX.users.find(x=>(x.id===id||x.email===id)&&x.password===p);if(!u)return false;DX.session={...u};sessionStorage.setItem("dx_session",JSON.stringify(DX.session));return true};DX.logout=()=>{DX.session=null;sessionStorage.removeItem("dx_session");location.hash="";DX.renderLogin()};try{DX.session=JSON.parse(sessionStorage.getItem("dx_session"))}catch(e){}
DX.routes={};DX.register=(n,f)=>DX.routes[n]=f;DX.go=n=>{location.hash=n;DX.closeSidebar&&DX.closeSidebar()};DX.renderRoute=()=>{if(!DX.session)return DX.renderLogin();let n=location.hash.slice(1)||"dashboard";(DX.routes[n]||DX.routes.dashboard)(document.getElementById("page"))};addEventListener("hashchange",DX.renderRoute);DX.nav=()=>DX.session.role==="admin"?[["dashboard","🏠","Dashboard"],["employees","👥","Employees"],["attendance","🕐","Attendance"],["leaves","📅","Leaves"],["payroll","💰","Payroll"],["advances","💳","Advances"],["reports","📊","Reports"]]:[["dashboard","🏠","My Dashboard"],["my-attendance","🕐","My Attendance"],["my-leaves","📅","My Leaves"],["my-salary","💰","My Salary"],["my-advances","💳","My Advances"],["profile","👤","My Profile"]];
DX.renderLogin=()=>{let t=DX.t[DX.lang];document.documentElement.dir=DX.lang==="ar"?"rtl":"ltr";document.getElementById("app").innerHTML=`<main class="auth"><section class="auth-card"><div class="lang"><button class="${DX.lang==="ar"?"active":""}" id="ar">عربي</button><button class="${DX.lang==="en"?"active":""}" id="en">English</button></div><div class="brand">Dawam<span>X</span></div><div class="subtitle">${t.sub}</div><form id="login"><div class="field"><label>${t.id}</label><input id="lid" autocomplete="username" autofocus></div><div class="field"><label>${t.pass}</label><input id="lp" type="password" autocomplete="current-password"></div><button class="btn btn-primary">${t.enter}</button><div id="err" class="error"></div></form><div class="demo">Admin: <b>admin@dawamx.com</b> / <b>admin123</b><br>Employee: <b>0010</b> / <b>0010</b></div></section></main>`;ar.onclick=()=>DX.setLang("ar");en.onclick=()=>DX.setLang("en");login.onsubmit=e=>{e.preventDefault();if(DX.login(lid.value.trim(),lp.value)){DX.renderApp();location.hash="dashboard"}else err.textContent=t.bad}};DX.closeSidebar=()=>{let s=document.getElementById("side"),o=document.getElementById("overlay");if(s)s.classList.remove("open");if(o)o.classList.remove("open")};DX.toggleSidebar=()=>{let s=document.getElementById("side"),o=document.getElementById("overlay");if(s)s.classList.toggle("open");if(o)o.classList.toggle("open")};DX.renderApp=()=>{document.documentElement.dir=DX.lang==="ar"?"rtl":"ltr";let n=DX.nav();document.getElementById("app").innerHTML=`<div class="shell"><aside id="side" class="sidebar"><div class="side-brand">Dawam<span>X</span></div><div class="nav">${n.map(x=>`<button onclick="DX.go('${x[0]}')">${x[1]} ${x[2]}</button>`).join("")}<button onclick="DX.logout()">🚪 Logout</button></div></aside><div class="overlay" id="overlay" onclick="DX.closeSidebar()"></div><main class="main"><div class="topbar"><button class="btn mobile-menu" onclick="DX.toggleSidebar()">☰</button><div class="top-actions"><div class="user-pill">${DX.session.name} · ${DX.session.id}</div><button class="btn" onclick="DX.setLang(DX.lang==='ar'?'en':'ar')">${DX.lang==='ar'?'English':'عربي'}</button></div></div><section id="page"></section></main></div>`;DX.renderRoute()};DX.register("dashboard",p=>p.innerHTML=`<h2>Dashboard</h2><div class="grid"><div class="card">Employees<div class="stat">128</div></div><div class="card">Present Today<div class="stat">116</div></div><div class="card">Pending Leaves<div class="stat">7</div></div><div class="card">Pending Advances<div class="stat">4</div></div></div>`);DX.employees=[{id:"0010",name:"محمد أحمد",dept:"HR",job:"HR Officer",salary:"450 KWD"},{id:"0011",name:"Ahmed Ali",dept:"Operations",job:"Supervisor",salary:"600 KWD"},{id:"0012",name:"سارة محمد",dept:"Finance",job:"Accountant",salary:"520 KWD"}];DX.register("employees",p=>{p.innerHTML=`<h2>Employees</h2><div class="toolbar"><input id="search" class="search" placeholder="Search by Employee ID or name"><button class="btn btn-primary" onclick="DX.openEmployee('new')">+ Add Employee</button></div><div id="results"></div>`;search.oninput=()=>DX.filter(search.value);DX.filter("")});DX.filter=q=>{q=q.toLowerCase();results.innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Employee ID</th><th>Name</th><th>Department</th><th>Job</th><th>Salary</th><th></th></tr></thead><tbody>${DX.employees.filter(e=>(e.id+" "+e.name).toLowerCase().includes(q)).map(e=>`<tr><td><b>${e.id}</b></td><td>${e.name}</td><td>${e.dept}</td><td>${e.job}</td><td>${e.salary}</td><td><button class="btn" onclick="DX.openEmployee('${e.id}')">View</button></td></tr>`).join("")}</tbody></table></div>`};DX.openEmployee=id=>{let e=DX.employees.find(x=>x.id===id);if(!e)return;document.body.insertAdjacentHTML("beforeend",`<div class="modal-backdrop" id="m"><div class="modal"><h2>Employee 360</h2><div class="profile-grid">${Object.entries({Employee_ID:e.id,Name:e.name,Department:e.dept,Job:e.job,Salary:e.salary,Civil_ID:"—",Residency_Expiry:"—",Passport_Expiry:"—",Contract_Expiry:"—"}).map(([k,v])=>`<div class="profile-item"><b>${k.replaceAll("_"," ")}</b>${v}</div>`).join("")}</div><br><button class="btn" onclick="m.remove()">Close</button></div></div>`)};["attendance","leaves","payroll","advances","reports","my-attendance","my-leaves","my-salary","my-advances","profile"].forEach(n=>DX.register(n,p=>p.innerHTML=`<div class="notice"><b>${n.replaceAll("-"," ")}</b><br>Module foundation ready.</div>`));if(DX.session)DX.renderApp();else DX.renderLogin();
</script>
</body></html>
